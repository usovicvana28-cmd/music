name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack Android project
        run: |
          mkdir source
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source
          test -f source/MyMusicPlayer-v1/settings.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon assembleDebug
        working-directory: source/MyMusicPlayer-v1

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: MyMusicPlayer-APK
          path: source/MyMusicPlayer-v1/app/build/outputs/apk/debug/app-debug.apk
